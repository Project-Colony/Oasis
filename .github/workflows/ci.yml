name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup is on every GitHub-hosted runner image, so there is no
      # third-party toolchain action to pin.
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all
      # The release workflow smoke-tests `oasis --version` on every artifact.
      # Checking the same thing here fails the PR that breaks it, not the
      # release tag. It must print and exit before any config, GUI or network.
      - name: Smoke-test --version
        shell: bash
        run: cargo run --quiet --locked -- --version | grep '^oasis [0-9]'
      # An unknown argument must exit 2 with the usage on stderr, not start
      # the daemon. The help follows the system language, so look for what
      # both locales share.
      - name: Smoke-test an unknown argument
        shell: bash
        run: |
          set +e
          cargo run --quiet --locked -- --bogus 2> stderr.txt
          status=$?
          set -e
          [ "$status" -eq 2 ] || { echo "::error::oasis --bogus exited $status, expected 2"; exit 1; }
          grep -qF 'oasis [OPTION]' stderr.txt || { echo "::error::oasis --bogus did not print the usage on stderr"; cat stderr.txt; exit 1; }

  # rust-version in Cargo.toml is a promise about who can build Oasis. Without
  # this job nothing ever builds on it, and it drifts.
  #
  # RUSTUP_TOOLCHAIN is what pins the cargo invocations: it outranks both the
  # rustup default and any rust-toolchain.toml. The rustc check makes a pin
  # that silently stopped working fail loudly.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(grep '^rust-version' Cargo.toml | tr -d ' "' | cut -d= -f2)
          [ -n "$version" ] || { echo "::error::could not read rust-version from Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"

      - name: Install Rust
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Build on the declared floor
        run: |
          rustc --version | grep -q "^rustc ${RUSTUP_TOOLCHAIN}[. ]" \
            || { echo "::error::expected rustc ${RUSTUP_TOOLCHAIN}, got $(rustc --version)"; exit 1; }
          cargo check --locked --all-targets
