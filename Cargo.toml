[package]
name = "oasis-weather-notify"
version = "0.1.0"
edition = "2024"

description = "Global hotkey weather notification app (IP geolocation + current conditions)."
license = "MIT"

[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
reqwest = { version = "0.13.1", features = ["json", "rustls"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
toml = "0.9.7"

global-hotkey = "0.7.0"
tao = "0.34.5"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.11.7"

[target.'cfg(target_os = "windows")'.dependencies]
winrt-notification = "0.5.1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.9"
