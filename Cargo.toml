[package]
name = "oasis"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"

description = "Global hotkey weather notification app (IP geolocation + current conditions)."
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/Oasis"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
toml = "1.1.7"
# Only for colony_ui::paths (the shared Colony/<Program> layout); no fonts embedded.
# ponytail: colony-ui 0.1.6 pulls iced and wgpu into the build although Oasis opens no
# window. Follow-up in Project-Colony-Resources: gate iced behind a default "gui"
# feature so windowless tools keep default-features = false and skip it.
colony-ui = { version = "0.1.6", default-features = false }

global-hotkey = "0.8.0"
# tao 0.37 enables its dbus feature by default (the XDG portal colour scheme for
# windows). Oasis opens no window, so keep the 0.34 feature set and skip libdbus.
tao = { version = "0.37.1", default-features = false, features = ["rwh_06", "x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18.2"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
