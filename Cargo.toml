[package]
name = "oasis-weather-notify"
version = "0.1.0"
edition = "2024"

description = "Global hotkey weather notification app (IP geolocation + current conditions)."
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

global-hotkey = "0.5"
notify-rust = "4"
winrt-notification = "0.5"
mac-notification-sys = "0.6"
